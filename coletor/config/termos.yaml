# Termos monitorados no Google Trends
#
# Cada grupo vira UMA busca (o Google Trends compara até 5 termos por vez).
# Todo grupo inclui a âncora, para que os valores de grupos diferentes
# possam ser comparados entre si (ver docs/metodologia.md).

ancora: "bolsa família"

macrotemas:
  posto de saúde: Saúde
  ubs: Saúde
  mais médicos: Saúde
  saúde da família: Saúde
  brasil sorridente: Saúde
  escola pública: Educação
  creche: Educação
  merenda escolar: Educação
  dinheiro direto na escola: Educação
  escola em tempo integral: Educação
  aposentadoria: Aposentadoria e renda
  inss: Aposentadoria e renda
  bpc loas: Aposentadoria e renda
  bolsa família: Aposentadoria e renda
  lula: Candidatos
  flávio bolsonaro: Candidatos
  bolsonaro: Candidatos
  # Ataques a Lula
  roberta luchsinger: ATQ_LULA
  luchsinger: ATQ_LULA
  lulinha: ATQ_LULA
  filho do lula: ATQ_LULA
  filho lula bateu: ATQ_LULA
  lula lobista: ATQ_LULA
  lula socio: ATQ_LULA
  lula vorcaro: ATQ_LULA
  # Ataques a Flávio (orgânicos)
  134 milhoes: ATQ_FLAVIO_ORG
  flavio vorcaro: ATQ_FLAVIO_ORG
  inimigo do trabalhador: ATQ_FLAVIO_ORG
  privatizar o sus: ATQ_FLAVIO_ORG
  lottenberg: ATQ_FLAVIO_ORG
  flavio 6x1: ATQ_FLAVIO_ORG
  # Ataques a Flávio (impulsionados)
  flavio miliciano: ATQ_FLAVIO_PUSH
  flavio ana clara: ATQ_FLAVIO_PUSH
  flavio comando vermelho: ATQ_FLAVIO_PUSH
  bolsonaro miliciano: ATQ_FLAVIO_PUSH
  armas bolsonaro: ATQ_FLAVIO_PUSH
  inflacao bolsonaro: ATQ_FLAVIO_PUSH

# A âncora é adicionada automaticamente a cada grupo (não repita aqui).
# Máximo de 4 termos por grupo (4 + âncora = 5, limite do Google Trends).
grupos:
  G1: [inss, aposentadoria, posto de saúde, creche]
  G2: [ubs, escola pública, bpc loas, merenda escolar]
  G3: [mais médicos, saúde da família, escola em tempo integral, dinheiro direto na escola]
  G4: [brasil sorridente]
  CAND: [lula, flávio bolsonaro, bolsonaro]
  # Cada consulta aceita 4 termos + âncora: listas maiores viram dois grupos.
  ATQ_LULA_1: [roberta luchsinger, luchsinger, lulinha, filho do lula]
  ATQ_LULA_2: [filho lula bateu, lula lobista, lula socio, lula vorcaro]
  ATQ_FLAVIO_ORG_1: [134 milhoes, flavio vorcaro, inimigo do trabalhador, privatizar o sus]
  ATQ_FLAVIO_ORG_2: [lottenberg, flavio 6x1]
  ATQ_FLAVIO_PUSH_1: [flavio miliciano, flavio ana clara, flavio comando vermelho, bolsonaro miliciano]
  ATQ_FLAVIO_PUSH_2: [armas bolsonaro, inflacao bolsonaro]

candidatos: [lula, flávio bolsonaro, bolsonaro]

# Macrotemas cujos termos entram nas buscas relacionadas a cada 3 dias (job relacionadas_temas).
# Os termos de ataque ficam de fora para não gastar 20 buscas extras por coleta.
macrotemas_relacionadas: [Saúde, Educação, Aposentadoria e renda]
