name: Coleta diária Google Trends

on:
  schedule:
    # 09:47 UTC = 06:47 em Brasília. O GitHub pode atrasar alguns minutos.
    # Roda de hora em hora entre 9h47 e 17h47 UTC. A coleta é idempotente:
    # cada execução pega só o que faltou (útil quando o plano limita buscas por hora).
    - cron: "47 9-17 * * *"
  workflow_dispatch:
    inputs:
      somente:
        description: "Rodar só um job (estados, cidades, relacionadas_candidatos, relacionadas_temas). Vazio = todos."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: coleta-trends
  cancel-in-progress: false

defaults:
  run:
    working-directory: coletor

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.somente }}" ]; then
            python -m coletor executar --somente "${{ github.event.inputs.somente }}"
          else
            python -m coletor executar
          fi
          echo "STATUS=$?" >> "$GITHUB_ENV"

      - name: Salvar dados no repositório
        run: |
          git config user.name "coletor-trends"
          git config user.email "coletor-trends@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "dados: coleta $(TZ=America/Sao_Paulo date +%F)"
            git push
          fi

      - name: Falhar se houve erro na coleta
        if: env.STATUS != '0'
        run: |
          echo "A coleta terminou com status $STATUS. Veja data/log_coletas.csv."
          exit 1
